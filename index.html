<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam 登入</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="main-container">
    <header class="site-header">
        <div class="header-content">
            <div class="logo-container">
                <img src="logo_steam.svg" alt="Steam" class="steam-logo">
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="#">商店</a></li>
                    <li><a href="#" class="active">社群</a></li>
                    <li><a href="#">關於</a></li>
                    <li><a href="#">客服中心</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <a href="#" class="download-btn">安裝 Steam</a>
                <a href="#" class="login-btn">登入</a>
                <div class="language-selector">
                    <span id="languageToggle">語言 ▼</span>
                    <ul class="language-dropdown">
                        <li>繁體中文</li>
                        <li>简体中文</li>
                        <li>English</li>
                        <li>日本語</li>
                        <li>한국어</li>
                        <li>Deutsch</li>
                        <li>Français</li>
                        <li>Español</li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <main class="login-main">
        <div class="login-container">
            <h1 class="login-title">登入</h1>

            <div class="login-options-wrapper">
                <div class="login-options">
                    <div class="account-login">
                        <h3>以帳戶名稱登入</h3>
                        <form id="loginForm">
                            <div class="form-group">
                                <input type="text" id="username" name="username" placeholder="" required>
                            </div>
                            <h3>密碼</h3>
                            <div class="form-group">
                                <input type="password" id="password" name="password" placeholder="" required>
                            </div>
                            <div class="form-check">
                                <input type="checkbox" id="remember" name="remember">
                                <label for="remember">記住我</label>
                            </div>
                            <button type="submit" class="login-button">登入</button>
                        </form>
                        <div class="forgot-password">
                            <a href="#">幫幫我，我無法登入</a>
                        </div>
                    </div>

                    <div class="qr-login">
                        <h3>掃描 QR 碼登入</h3>
                        <div class="qr-code">
                            <img src="qr.png" alt="qr" >
                        </div>
                        <p class="qr-description">使用 Steam 行動應用程式掃描 QR 碼登入</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="script.js"></script>
</body>
</html>
