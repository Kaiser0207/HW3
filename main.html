<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Instagram 登入</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <div class="left">
        <div class="phone-mockup">
            <img src="https://via.placeholder.com/300x500" alt="mockup" class="main-img">
            <!-- 可自行加入更多裝飾圖案 -->
        </div>
    </div>
    <div class="right">
        <form class="login-form">
            <h1 class="logo">Instagram</h1>
            <input type="text" placeholder="手機號碼、用戶名稱或電子郵件地址" required>
            <input type="password" placeholder="密碼" required>
            <button type="submit">登入</button>
            <div class="divider">或</div>
            <button type="button" class="fb-login">使用 Facebook 帳號登入</button>
            <a href="#" class="forgot">忘記密碼？</a>
        </form>
        <div class="signup">
            沒有帳號嗎？<a href="#">註冊</a>
        </div>
    </div>
</div>
<footer>
    <div class="footer-links">
        Meta 關於 新聞 使用說明 API 職業 使用條款 隱私 地點 Instagram Lite Threads
    </div>
    <div class="footer-meta">
        中文(台灣) © 2025 Instagram from Meta
    </div>
</footer>
<script src="script.js"></script>
</body>
</html>
